seed: 2027
device: auto
datasets:
- geolink
curves_by_dataset:
  geolink:
  - GR
  - DTC
  - RHOB
  - NPHI
scales:
- 2
- 4
- 8
window: 128
stride: 128
max_windows_per_split:
  train: 1024
  val: 256
  test: 512
batch_size: 256
epochs: 300
min_train_epochs: 100
patience: 30
learning_rate: 0.0006
train_degradations: []
test_degradations: []
aux_scale_divisor: 2
output_dir: results/v2_guided/geolink/seed2027
methods:
  pchip: {}
  lstm:
    multi: false
    channels: 48
    depth: 3
    loss: &id001
      l1: 1.0
      gradient: 0.15
      spectral: 0.02
  ssm:
    multi: false
    channels: 48
    depth: 3
    loss: *id001
  dmcnet:
    multi: false
    channels: 48
    depth: 3
    loss: *id001
  cascade_sr:
    multi: false
    channels: 48
    depth: 3
    loss: *id001
  transformer:
    multi: false
    channels: 48
    depth: 3
    loss: *id001
  lstm_multi:
    arch: lstm
    multi: true
    channels: 48
    depth: 3
    loss: *id001
  ssm_multi:
    arch: ssm
    multi: true
    channels: 48
    depth: 3
    loss: *id001
  dmcnet_multi:
    arch: dmcnet
    multi: true
    channels: 48
    depth: 3
    loss: *id001
  cascade_sr_multi:
    arch: cascade_sr
    multi: true
    channels: 48
    depth: 3
