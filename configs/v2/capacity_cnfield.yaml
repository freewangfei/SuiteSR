seed: 2026
device: auto
datasets:
- cnfield
curves_by_dataset:
  cnfield:
  - GR
  - DTC
  - RHOB
  - NPHI
scales:
- 2
- 4
- 8
window: 128
stride: 128
max_windows_per_split:
  train: 1024
  val: 256
  test: 512
batch_size: 256
epochs: 300
min_train_epochs: 100
patience: 30
learning_rate: 0.0006
train_degradations: []
test_degradations: []
aux_scale_divisor: 2
output_dir: results/v2_capacity/cnfield/seed2026
methods:
  geosr2_c48:
    arch: geosr2
    multi: true
    channels: 48
    depth: 3
    loss: &id001
      l1: 1.0
      mse: 0.35
      gradient: 0.12
      spectral: 0.012
  geosr2_c48d4:
    arch: geosr2
    multi: true
    channels: 48
    depth: 4
    loss: *id001
  geosr2_c64d4:
    arch: geosr2
    multi: true
    channels: 64
    depth: 4
    loss: *id001
