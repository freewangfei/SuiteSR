seed: 2026
device: auto
datasets:
- geolink
curves_by_dataset:
  geolink:
  - GR
  - DTC
  - RHOB
  - NPHI
scales:
- 2
- 4
- 8
window: 128
stride: 128
max_windows_per_split:
  train: 1024
  val: 256
  test: 512
batch_size: 256
epochs: 300
min_train_epochs: 100
patience: 30
learning_rate: 0.0006
train_degradations: []
test_degradations: []
aux_scale_divisor: 2
output_dir: results/v2_evidence/geolink/seed2026
methods:
  pchip: {}
  ssm:
    multi: false
    channels: 48
    depth: 3
    loss: &id001
      l1: 1.0
      gradient: 0.15
      spectral: 0.02
  ssm_multi:
    arch: ssm
    multi: true
    channels: 48
    depth: 3
    loss: *id001
  geosr2:
    arch: geosr2
    multi: true
    channels: 32
    depth: 3
    loss: &id002
      l1: 1.0
      mse: 0.35
      gradient: 0.12
      spectral: 0.012
  geosr2_single:
    arch: geosr2
    multi: false
    channels: 32
    depth: 3
    loss: *id002
  ssm_native:
    arch: ssm_native
    multi: true
    channels: 48
    depth: 3
    loss: &id003
      l1: 1.0
      gradient: 0.15
      spectral: 0.02
  ssm_morph_native:
    arch: ssm_morph_native
    multi: true
    channels: 48
    depth: 3
    loss: *id003
save_predictions: true
