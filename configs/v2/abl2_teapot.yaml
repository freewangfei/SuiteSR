seed: 2026
device: auto
datasets:
- teapot
curves_by_dataset:
  teapot:
  - GR
  - RHOB
  - NPHI
scales:
- 2
- 4
- 8
window: 128
stride: 128
max_windows_per_split:
  train: 1024
  val: 256
  test: 512
batch_size: 256
epochs: 300
min_train_epochs: 100
patience: 30
learning_rate: 0.0006
train_degradations: []
test_degradations: []
aux_scale_divisor: 2
output_dir: results/v5_ablation2/teapot/seed2026
methods:
  geosr2_plainblock:
    arch: geosr2_plainblock
    multi: true
    channels: 32
    depth: 3
    loss: &id001
      l1: 1.0
      mse: 0.35
      gradient: 0.12
      spectral: 0.012
  geosr2_morphtarget:
    arch: geosr2_morphtarget
    multi: true
    channels: 32
    depth: 3
    loss: *id001
  geosr2_morphguide:
    arch: geosr2_morphguide
    multi: true
    channels: 32
    depth: 3
    loss: *id001
