seed: 2026
device: auto
datasets:
- geolink
curves_by_dataset:
  geolink:
  - GR
  - DTC
  - RHOB
  - NPHI
scales:
- 2
- 4
- 8
window: 128
stride: 128
max_windows_per_split:
  train: 1024
  val: 256
  test: 512
batch_size: 256
epochs: 300
min_train_epochs: 100
patience: 30
learning_rate: 0.0006
train_degradations: []
test_degradations: []
aux_scale_divisor: 2
output_dir: results/v2_ablation/geolink/seed2026
methods:
  geosr2_deep:
    arch: geosr2_deep
    multi: true
    channels: 32
    depth: 3
    loss: &id001
      l1: 1.0
      mse: 0.35
      gradient: 0.12
      spectral: 0.012
  geosr2_nomorph:
    arch: geosr2_nomorph
    multi: true
    channels: 32
    depth: 3
    loss: *id001
  geosr2_norecur:
    arch: geosr2_norecur
    multi: true
    channels: 32
    depth: 3
    loss: *id001
  geosr2_full:
    arch: geosr2
    multi: true
    channels: 32
    depth: 3
    loss: *id001
