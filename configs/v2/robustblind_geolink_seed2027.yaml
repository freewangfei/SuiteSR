seed: 2027
device: auto
datasets:
- geolink
curves_by_dataset:
  geolink:
  - GR
  - DTC
  - RHOB
  - NPHI
scales:
- 4
- 8
window: 128
stride: 128
max_windows_per_split:
  train: 1024
  val: 256
  test: 512
batch_size: 256
epochs: 300
min_train_epochs: 100
patience: 30
learning_rate: 0.0006
train_degradations:
- kind: gaussian
  sigma_factor: 0.75
- kind: gaussian
  sigma_factor: 1.25
- kind: box
test_degradations:
- kind: gaussian
  sigma_factor: 0.75
  label: gaussian_0.75
- kind: gaussian
  sigma_factor: 1.25
  label: gaussian_1.25
- kind: box
  label: box
- kind: gaussian
  sigma_factor: 0.6
  label: gaussian_0.6
- kind: gaussian
  sigma_factor: 1.5
  label: gaussian_1.5
- kind: box
  width_factor: 1.5
  label: box_1.5
- kind: triangle
  width_factor: 1.0
  label: triangle
- kind: exp
  sigma_factor: 0.5
  label: exp_asym
aux_scale_divisor: 2
output_dir: results/v5_robust_blind/geolink/seed2027
methods:
  ssm_blind:
    multi: false
    channels: 48
    depth: 3
    loss: &id001
      l1: 1.0
      gradient: 0.15
      spectral: 0.02
    arch: ssm
  ssm_multi_blind:
    arch: ssm
    multi: true
    channels: 48
    depth: 3
    loss: *id001
  ssm_native_blind:
    arch: ssm_native
    multi: true
    channels: 48
    depth: 3
    loss:
      l1: 1.0
      gradient: 0.15
      spectral: 0.02
  geosr2_blind:
    arch: geosr2
    multi: true
    channels: 32
    depth: 3
    loss:
      l1: 1.0
      mse: 0.35
      gradient: 0.12
      spectral: 0.012
  ssm_morph_native_blind:
    arch: ssm_morph_native
    multi: true
    channels: 48
    depth: 3
    loss:
      l1: 1.0
      gradient: 0.15
      spectral: 0.02
